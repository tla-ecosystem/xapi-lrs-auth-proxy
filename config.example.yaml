# Single-Tenant Configuration Example
# For on-premises or single-organization deployments

mode: single-tenant

server:
  port: 8080
  host: "0.0.0.0"

# LRS backend configuration
lrs:
  endpoint: "https://lrs.example.com/xapi/"
  username: "admin"
  password: "${LRS_PASSWORD}"  # Use environment variable
  connection_timeout: 30  # seconds
  max_retries: 3

# Authentication configuration
auth:
  jwt_secret: "${JWT_SECRET}"  # MUST be at least 32 bytes, use environment variable
  jwt_ttl_seconds: 14400  # 4 hours (this is also the default if omitted)
  permission_policy: "strict"  # or "permissive"

  # LMS API keys (used by LMS to request tokens)
  lms_api_keys:
    - "${LMS_API_KEY_1}"
    - "${LMS_API_KEY_2}"  # Optional: multiple LMS instances

  # Optional: full-access Basic Auth credentials for test/admin tools (e.g.
  # xAPI conformance suites) that need to talk to the proxy exactly like
  # they'd talk to the raw LRS. Requests using one of these skip all
  # actor/activity/registration scoping and are forwarded straight to the
  # backend LRS — same blast radius as the raw LRS credential. Do NOT hand
  # these out to real course content; use per-launch JWTs (issued via
  # /auth/token) for that.
  # passthrough_keys:
  #   - username: "tlatests-admin"
  #     password: "${TLATESTS_PASSWORD}"

# Optional: Redis caching (improves performance)
# redis:
#   host: "localhost"
#   port: 6379
#   password: "${REDIS_PASSWORD}"
#   db: 0
#   cache_ttl: 300  # 5 minutes
