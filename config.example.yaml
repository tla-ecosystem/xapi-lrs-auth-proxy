# Single-Tenant Configuration Example
# For on-premises or single-organization deployments

mode: single-tenant

server:
  port: 8080
  host: "0.0.0.0"

# LRS backend configuration
lrs:
  endpoint: "https://lrs.example.com/xapi/"
  username: "admin"
  password: "${LRS_PASSWORD}"  # Use environment variable
  connection_timeout: 30  # seconds
  max_retries: 3

# Authentication configuration
auth:
  jwt_secret: "${JWT_SECRET}"  # MUST be at least 32 bytes, use environment variable
  jwt_ttl_seconds: 14400  # 4 hours (this is also the default if omitted)
  permission_policy: "strict"  # or "permissive"

  # LMS API keys (used by LMS to request tokens)
  lms_api_keys:
    - "${LMS_API_KEY_1}"
    - "${LMS_API_KEY_2}"  # Optional: multiple LMS instances

  # Optional: full-access Basic Auth credentials for test/admin tools (e.g.
  # xAPI conformance suites) that need to talk to the proxy exactly like
  # they'd talk to the raw LRS. Requests using one of these skip all
  # actor/activity/registration scoping and are forwarded straight to the
  # backend LRS — same blast radius as the raw LRS credential. Do NOT hand
  # these out to real course content; use per-launch JWTs (issued via
  # /auth/token) for that.
  # passthrough_keys:
  #   - username: "tlatests-admin"
  #     password: "${TLATESTS_PASSWORD}"

# Optional: statement forwarding sink. After a statement write is accepted by
# the backend LRS, statements whose verb is in the list below are also POSTed
# to each destination as JSON:
#   {"tenant_id": "...", "verb_id": "...", "statement": { ...original xAPI statement... }}
# This is how a listener (e.g. a HazReady .NET action) gets cmi5/answered/
# interacted statements into its own SQL for reporting, independent of which
# LRS is actually being used. Delivery is asynchronous, in-memory, and
# best-effort-with-retry — NOT durable. Statements still queued (not yet
# delivered) when the proxy process stops are lost; there's no persistent
# retry queue yet.
# statement_forwarding:
#   enabled: true
#   # If omitted while enabled: true, this defaults to the standard cmi5
#   # lifecycle verbs plus answered/interacted (see
#   # config.DefaultCmi5ForwardingVerbs in internal/config/config.go).
#   verbs:
#     - "http://adlnet.gov/expapi/verbs/launched"
#     - "http://adlnet.gov/expapi/verbs/initialized"
#     - "http://adlnet.gov/expapi/verbs/completed"
#     - "http://adlnet.gov/expapi/verbs/passed"
#     - "http://adlnet.gov/expapi/verbs/failed"
#     - "http://adlnet.gov/expapi/verbs/abandoned"
#     - "https://w3id.org/xapi/adl/verbs/waived"
#     - "https://w3id.org/xapi/adl/verbs/satisfied"
#     - "http://adlnet.gov/expapi/verbs/terminated"
#     - "http://adlnet.gov/expapi/verbs/answered"
#     - "http://adlnet.gov/expapi/verbs/interacted"
#   destinations:
#     - url: "https://yourlms.example.com/Cmi5/StatementListener"
#       # Sent as the "X-Cmi5-Forward-Secret" header so the listener can
#       # confirm the call actually came from this proxy. Set the same value
#       # on the HazReady side (Cmi5StatementForwardingSecret in Web.config).
#       shared_secret: "${CMI5_FORWARD_SHARED_SECRET}"
#       timeout_seconds: 10       # default 10 if omitted
#       max_retries: 5            # default 5 if omitted
#       retry_backoff_seconds: 2  # default 2 if omitted (linear backoff: 2s, 4s, 6s, ...)

# Optional: Redis caching (improves performance)
# redis:
#   host: "localhost"
#   port: 6379
#   password: "${REDIS_PASSWORD}"
#   db: 0
#   cache_ttl: 300  # 5 minutes
